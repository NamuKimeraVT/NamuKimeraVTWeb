<!DOCTYPE html>
<html lang="es">

<head>
    <title>NamuKimeraVT - Contacto</title>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light only" />
    <meta property="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" type="text/css" href="Estilos.css">
    <link rel="stylesheet" type="text/css" href="EstilosAnimaciones.css">
    <link rel="icon" type="image/png" href="img/Foto de Perfil.png" />
    <link rel="apple-touch-icon" href="img/Foto de Perfil.png" />
    <script src="BACKEND/app.py"></script>
    <script src="BACKEND/formulario.js"></script>
    <script src="Animations.js"></script>
    <script src="Footer&Navloader.js"></script>
</head>

<body class="is-loading">
    <div id="nav-container"></div>
    <h1 id="texttitlemain1" class="text">♦ CONTACTO ♦</h1>
    <section class="container">
        <div class="section">
            <p id="textp" class="text">
                Usa este formulario para preguntarme lo que quieras, cosas como collabs, trabajo, etc.
            </p>
        </div>
    </section>
    <div>
        <img src="img/LOGO ACTUAL.png" style="width: 60%; margin-left: 20%; margin-right: 20%;" class="animated-photo" data-animation="slide-left" />
    </div>
    <section id="main-form">
        <section class="inner-form">
            <!-- El id "form-contacto" coincide con el que usaremos en JS -->
            <form id="form-contacto">

                <div class="form-group">
                    <label for="input-nombre">Nombre</label>
                    <input type="text" id="input-nombre" placeholder="Tu nombre completo" required>
                </div>

                <div class="form-group">
                    <label for="input-correo">Correo Electrónico</label>
                    <input type="email" id="input-correo" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="form-group">
                    <label for="input-mensaje">Mensaje</label>
                    <textarea id="input-mensaje" placeholder="Escribe tu mensaje aquí..." required></textarea>
                </div>

                <button type="submit" class="btn-enviar">Enviar Mensaje</button>
            </form>
        </section>
    </section>
    <div id="footer-container"></div>
</body>
</html>
